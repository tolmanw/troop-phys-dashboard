name: Sync Strava Data

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

# Prevent scheduled and manually triggered runs from pushing simultaneously
concurrency:
  group: strava-data-sync
  cancel-in-progress: false

# Allow the workflow's GitHub token to push repository changes
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository with full Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Install dependencies
      - name: Install dependencies
        run: pip install requests

      # Run Strava fetch script
      - name: Run Strava fetch
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKENS: ${{ secrets.STRAVA_REFRESH_TOKENS }}
          ATHLETE_ALIASES: ${{ secrets.ATHLETE_ALIASES }}
        run: python scripts/fetch_strava.py

      # Commit and push updated JSON files
      - name: Commit updated JSON files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add all generated data files
          git add -f data/

          # Stop successfully when nothing changed
          if git diff --cached --quiet; then
            echo "No changes to JSON files, skipping commit."
            exit 0
          fi

          git commit -m "Sync Strava data"

          # Rebase onto the latest main branch and retry if main changes again
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Strava data pushed successfully."
              exit 0
            fi

            echo "Remote changed before push; retrying..."
            sleep 5
          done

          echo "Push failed after three attempts."
          exit 1
